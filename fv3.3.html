*{box-sizing:border-box}html{scroll-behavior:smooth}body{min-height:100vh;margin:0;overflow-x:hidden;color:var(--ink);background:radial-gradient(circle at 8% 4%,rgba(93,176,255,.34),transparent 29rem),radial-gradient(circle at 92% 17%,rgba(107,223,174,.25),transparent 32rem),radial-gradient(circle at 45% 92%,rgba(145,119,255,.18),transparent 34rem),var(--bg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.075'/%3E%3C/svg%3E")}button,select{font:inherit}button:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.app{width:min(1120px,calc(100% - 28px));margin:auto;padding:max(24px,env(safe-area-inset-top)) 0 72px}.hero{padding:8px 4px 18px}.eyebrow{margin:0 0 8px;color:var(--muted);font-size:.78rem;font-weight:750;letter-spacing:.13em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,7vw,4.7rem);line-height:.96;letter-spacing:-.055em}.subtitle{margin:14px 0 0;color:var(--muted);line-height:1.55}.hero,.controls{transition:opacity .28s,transform .38s cubic-bezier(.2,.8,.2,1)}body.is-compact .hero,body.is-compact .controls{opacity:.18;transform:translateY(-12px) scale(.985);pointer-events:none}.controls{position:relative;z-index:10;padding:10px 0 12px}.glass{overflow:hidden;border:1px solid var(--line);border-radius:26px;background:var(--glass);box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(165%);-webkit-backdrop-filter:blur(24px) saturate(165%)}.section-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 14px 8px 18px}.section-label{color:var(--muted);font-size:.78rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase}.segment{display:grid;grid-template-columns:repeat(2,minmax(68px,1fr));gap:4px;width:min(240px,58vw);padding:4px;border:1px solid var(--line);border-radius:16px;background:rgba(127,146,170,.11)}.segment button,.island-section button{border:0;color:var(--muted);background:transparent;font-weight:800;cursor:pointer}.segment button{min-height:40px;border-radius:12px}.segment button[aria-pressed=true]{color:var(--ink);background:var(--glass2);box-shadow:0 5px 18px rgba(32,57,85,.12)}.day-track{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 14px;scrollbar-width:none}.day-track::-webkit-scrollbar{display:none}.day-button{flex:0 0 auto;min-height:38px;padding:0 16px;border:1px solid transparent;border-radius:999px;color:var(--muted);background:transparent;font-size:.87rem;font-weight:750;cursor:pointer}.day-button:hover,.day-button[aria-pressed=true]{color:var(--ink);border-color:var(--line);background:var(--glass2)}
.dynamic-island{position:fixed;z-index:100;top:max(10px,env(safe-area-inset-top));left:50%;display:flex;align-items:center;gap:7px;width:min(326px,calc(100% - 28px));min-height:49px;padding:6px;border:1px solid rgba(255,255,255,.13);border-radius:999px;color:#fff;background:rgba(5,10,18,.88);box-shadow:0 14px 38px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(24px) saturate(180%);opacity:0;transform:translate(-50%,-22px) scale(.82);pointer-events:none;transition:.3s}body.is-compact .dynamic-island{opacity:1;transform:translate(-50%,0);pointer-events:auto}.island-section{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;width:104px;padding:3px;border-radius:999px;background:rgba(255,255,255,.09)}.island-section button{min-height:34px;border-radius:999px;color:rgba(255,255,255,.58);font-size:.77rem}.island-section button[aria-pressed=true]{color:#fff;background:rgba(255,255,255,.16)}.island-divider{width:1px;height:24px;background:rgba(255,255,255,.14)}.island-day-wrap{position:relative;flex:1;min-width:0}.island-day{width:100%;min-height:36px;padding:0 28px 0 11px;border:0;border-radius:999px;color:#fff;background:rgba(255,255,255,.08);font-size:.78rem;font-weight:800;appearance:none}.live-pip{width:8px;height:8px;margin-right:6px;border-radius:50%;background:rgba(255,255,255,.18)}.live-pip.is-live{background:#5aa9ff;box-shadow:0 0 0 5px rgba(90,169,255,.13),0 0 16px #5aa9ff;animation:pulse 1.8s infinite}.live-pip.ending-soon{background:#57df8c;box-shadow:0 0 0 5px rgba(87,223,140,.14),0 0 18px #57df8c}.summary{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;padding:22px 4px 12px}.summary h2{margin:0;font-size:clamp(1.32rem,3vw,1.8rem)}.summary p{margin:0;color:var(--muted);font-size:.9rem}.schedule{display:grid;gap:28px}.day-section{scroll-margin-top:80px}.day-heading{display:flex;align-items:center;gap:12px;margin:0 4px 12px}.day-heading h3{margin:0;font-size:1.12rem}.day-heading span{color:var(--muted);font-size:.8rem;font-weight:700}.day-heading:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(100,115,135,.28),transparent)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.class-card{position:relative;isolation:isolate;min-height:210px;overflow:hidden;padding:20px;border:1px solid var(--card-line);border-radius:25px;background:linear-gradient(145deg,var(--card-bg),var(--glass));box-shadow:var(--shadow);backdrop-filter:blur(22px) saturate(155%);transition:.35s}.class-card:before{content:"";position:absolute;z-index:-1;width:150px;height:150px;right:-42px;top:-60px;border-radius:50%;background:var(--glow);filter:blur(10px);opacity:.55}.theory{--card-bg:var(--green-bg);--card-line:var(--green-line);--accent:var(--green);--glow:rgba(92,222,156,.25)}.lab{--card-bg:var(--blue-bg);--card-line:var(--blue-line);--accent:var(--blue);--glow:rgba(82,172,255,.26)}.class-card.is-live{border-color:#5baaff;transform:translateY(-3px);box-shadow:0 22px 58px rgba(35,122,220,.24),0 0 34px rgba(63,150,245,.2)}.class-card.is-live.ending-soon{border-color:#4cd587;box-shadow:0 22px 58px rgba(31,160,89,.22),0 0 36px rgba(76,213,135,.23)}.card-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}.pill{display:inline-flex;align-items:center;width:fit-content;min-height:38px;padding:8px 14px;border:1px solid var(--card-line);border-radius:999px;background:linear-gradient(145deg,var(--glass2),rgba(255,255,255,.08));box-shadow:0 7px 18px rgba(23,48,75,.09),inset 0 1px 0 rgba(255,255,255,.32);backdrop-filter:blur(14px) saturate(150%);font-size:.8rem;font-weight:800;transition:.2s}.pill:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 10px 24px rgba(23,48,75,.14)}.icon{margin-right:7px;font-size:.92rem}.kind{gap:0;color:var(--accent);font-size:.75rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.kind:before{content:"";display:none;width:8px;height:8px;flex:0 <body>
<div class="dynamic-island" aria-label="Compact routine controls"><div class="island-section" role="group" aria-label="Choose sub-section"><button type="button" data-section="F1" aria-pressed="true">F1</button><button type="button" data-section="F2" aria-pressed="false">F2</button></div><span class="island-divider"></span><label class="island-day-wrap"><span class="sr-only">Selected day</span><select class="island-day" id="islandDay"></select></label><span class="live-pip" id="livePip"></span></div>
<main class="app"><header class="hero"><p class="eyebrow">Daffodil International University · EEE</p><h1>1-2 F Routine</h1><p class="subtitle">Fall 2026 · Version 3.0 · Effective September 19, 2026</p></header><div class="controls"><div class="glass"><div class="section-row"><span class="section-label">Sub-section</span><div class="segment" role="group"><button type="button" data-section="F1" aria-pressed="true">F1</button><button type="button" data-section="F2" aria-pressed="false">F2</button></div></div><nav aria-label="Filter by day"><div class="day-track" id="dayTrack"></div></nav></div></div><section class="summary" aria-live="polite"><h2 id="viewTitle"></h2><p id="classCount"></p></section><section class="schedule" id="schedule"></section></main>
<script>
const routine=[
["F1","Sunday","09:30","10:30","0541-121","Ordinary and Partial Differential Equation","Sarna Sarker","103","Theory"],["F1","Sunday","10:30","11:30","0713-121","Electrical Circuits II","Md. Wahiduzzaman","103","Theory"],["F1","Sunday","13:00","15:00","0613-122","Programming I","Sayeed Hossain Sayor","204","Lab"],["F1","Monday","10:30","11:30","0713-121","Electrical Circuits II","Md. Wahiduzzaman","405","Theory"],["F1","Monday","08:30","10:30","0531-112","Chemistry Laboratory","Dr. Md. Shahin Azad","Civil-A (303)","Lab"],["F1","Monday","13:00","14:00","0531-111","Chemistry","Songita Rani Adhikary","406","Theory"],["F1","Tuesday","08:30","10:30","0713-121","Electrical Circuits II","Dr. M. Shamsul Alam","103","Theory"],["F1","Tuesday","10:30","11:30","0541-121","Ordinary and Partial Differential Equation","Sarna Sarker","302","Theory"],["F1","Tuesday","11:30","12:30","0531-111","Chemistry","Songita Rani Adhikary","302","Theory"],["F1","Wednesday","11:30","12:30","0531-111","Chemistry","Songita Rani Adhikary","301","Theory"],["F1","Wednesday","13:00","15:00","0713-122","Electrical Circuits Laboratory","Md. Sanowar Hosen","105","Lab"],["F1","Wednesday","15:00","16:00","0541-121","Ordinary and Partial Differential Equation","Sarna Sarker","301","Theory"],
["F2","Sunday","09:30","10:30","0541-121","Ordinary and Partial Differential Equation","Sarna Sarker","103","Theory"],["F2","Sunday","10:30","11:30","0713-121","Electrical Circuits II","Md. Wahiduzzaman","103","Theory"],["F2","Sunday","13:00","15:00","0531-112","Chemistry Laboratory","Dr. Md. Shahin Azad","Civil-A (303)","Lab"],["F2","Monday","10:30","11:30","0713-121","Electrical Circuits II","Md. Wahiduzzaman","405","Theory"],["F2","Monday","08:30","10:30","0713-122","Electrical Circuits Laboratory","Md. Sanowar Hosen","105","Lab"],["F2","Monday","13:00","14:00","0531-111","Chemistry","Songita Rani Adhikary","406","Theory"],["F2","Tuesday","10:30","11:30","0541-121","Ordinary and Partial Differential Equation","Sarna Sarker","302","Theory"],["F2","Tuesday","11:30","12:30","0531-111","Chemistry","Songita Rani Adhikary","302","Theory"],["F2","Wednesday","08:30","10:30","0713-121","Electrical Circuits II","Dr. M. Shamsul Alam","103","Theory"],["F2","Wednesday","11:30","12:30","0531-111","Chemistry","Songita Rani Adhikary","301","Theory"],["F2","Wednesday","13:00","15:00","0613-122","Programming I","Sayeed Hossain Sayor","203","Lab"],["F2","Wednesday","15:00","16:00","0541-121","Ordinary and Partial Differential Equation","Sarna Sarker","301","Theory"]
].map(([section,day,start,end,code,course,teacher,room,type])=>({section,day,start,end,code,course,teacher,room,type}));
const days=["Saturday","Sunday","Monday","Tuesday","Wednesday","Thursday","Friday"],state={section:"F1",day:"All",dayTouched:false};
const schedule=document.querySelector("#schedule"),dayTrack=document.querySelector("#dayTrack"),islandDay=document.querySelector("#islandDay"),livePip=document.querySelector("#livePip"),viewTitle=document.querySelector("#viewTitle"),classCount=document.querySelector("#classCount");
const esc=v=>String(v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c]);
function formatTime(t){let[h,m]=t.split(":").map(Number);return`${h%12||12}:${String(m).padStart(2,"0")} ${h>=12?"PM":"AM"}`}
function sec(t){let[h,m]=t.split(":").map(Number);return h*3600+m*60}
function clock(){let p=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Dhaka",weekday:"long",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).reduce((a,x)=>(x.type!=="literal"&&(a[x.type]=x.value),a),{});return{day:p.weekday,seconds:+p.hour*3600 + +p.minute*60 + +p.second}}
function remaining(s){s=Math.max(0,Math.ceil(s));let h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")} left`:`${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")} left`}
function autoDay(){if(!state.dayTouched){state.day=days.includes(clock().day)?clock().day:"All"}}
function controls(){let opts=["All",...days];dayTrack.innerHTML=opts.map(d=>`<button class="day-button" data-day="${d}" aria-pressed="${d===state.day}">${d}</button>`).join("");islandDay.innerHTML=opts.map(d=>`<option>${d}</option>`).join("");sync()}
function sync(){document.querySelectorAll("[data-section]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.section===state.section));document.querySelectorAll("[data-day]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.day===state.day));islandDay.value=state.day}
function card(i){return`<article class="class-card ${i.type.toLowerCase()}" data-day="${esc(i.day)}" data-start="${i.start}" data-end="${i.end}"><div class="card-top"><span class="pill kind">${esc(i.type)}</span><time class="pill time"><span class="icon">◷</span>${formatTime(i.start)}–${formatTime(i.end)}</time></div><h4>${esc(i.course)}</h4><div class="meta"><p class="pill teacher"><span class="icon">♙</span>${esc(i.teacher)}</p><span class="pill room"><span class="icon">⌂</span>Room ${esc(i.room)}</span></div><div class="live-status"><div class="progress-track"><div class="progress-fill"></div></div><span class="countdown"></span></div></article>`}
function render(){let selected=state.day==="All"?days:[state.day],all=routine.filter(i=>i.section===state.section),visible=state.day==="All"?all:all.filter(i=>i.day===state.day);viewTitle.textContent=`${state.day==="All"?"All days":state.day} · ${state.section}`;classCount.textContent=`${visible.length} ${visible.length===1?"class":"classes"}`;schedule.innerHTML=selected.map(day=>{let list=all.filter(i=>i.day===day).sort((a,b)=>a.start.localeCompare(b.start));return`<section class="day-section"><div class="day-heading"><h3>${day}</h3><span>${list.length?`${list.length} ${list.length===1?"class":"classes"}`:"No classes"}</span></div>${list.length?`<div class="cards">${list.map(card).join("")}</div>`:`<div class="empty">No scheduled classes for ${state.section}.</div>`}</section>`}).join("");sync();updateLive()}
function updateLive(){let c=clock();document.querySelectorAll(".class-card").forEach(card=>{let s=sec(card.dataset.start),e=sec(card.dataset.end),live=card.dataset.day===c.day&&c.seconds>=s&&c.seconds<e,soon=live&&e-c.seconds<=600;card.classList.toggle("is-live",live);card.classList.toggle("ending-soon",soon);if(live){card.querySelector(".progress-fill").style.width=`${(c.seconds-s)/(e-s)*100}%`;card.querySelector(".countdown").textContent=remaining(e-c.seconds)}});let item=routine.find(i=>i.section===state.section&&i.day===c.day&&c.seconds>=sec(i.start)&&c.seconds<sec(i.end));livePip.classList.toggle("is-live",!!item);livePip.classList.toggle("ending-soon",!!item&&sec(item.end)-c.seconds<=600);livePip.title=item?`${item.course} is live`:"No class is live"}
document.addEventListener("click",e=>{let b=e.target.closest("button[data-section]");if(b){state.section=b.dataset.section;render()}});dayTrack.addEventListener("click",e=>{let b=e.target.closest("[data-day]");if(b){state.dayTouched=true;state.day=b.dataset.day;render();document.querySelector(".summary").scrollIntoView({behavior:"smooth"})}});islandDay.addEventListener("change",()=>{state.dayTouched=true;state.day=islandDay.value;render()});let ticking=false;addEventListener("scroll",()=>{if(!ticking){ticking=true;requestAnimationFrame(()=>{document.body.classList.toggle("is-compact",scrollY>118);ticking=false})}},{passive:true});autoDay();controls();render();setInterval(updateLive,1000);
</script>
