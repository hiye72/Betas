<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Fun Quiz 💖🔥</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Hind Siliguri', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #ff0a54, #ff477e, #9d4edd, #ff007f, #ff5c8a, #7b2cbf);
      background-size: 400% 400%;
      animation: spicyGradient 9s ease infinite;
      overflow: hidden;
      padding: 20px;
      position: relative;
    }

    @keyframes spicyGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ভাসমান রঙিন গার্লি ও স্পাইসি ইমোজি ব্যাকগ্রাউন্ড */
    .floating-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .float-item {
      position: absolute;
      bottom: -60px;
      font-size: 1.8rem;
      opacity: 0.55;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 0.65;
      }
      80% {
        opacity: 0.65;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    /* গ্লোয়িং সার্কেল */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(75px);
      opacity: 0.65;
      z-index: 0;
    }

    .orb1 {
      width: 280px;
      height: 280px;
      background: #ffb3c6;
      top: 8%;
      left: 10%;
    }

    .orb2 {
      width: 320px;
      height: 320px;
      background: #ff0054;
      bottom: 8%;
      right: 10%;
    }

    /* মূল কুইজ কার্ড */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-radius: 30px;
      padding: 42px 28px;
      text-align: center;
      color: #fff;
      box-shadow: 0 25px 55px rgba(100, 0, 45, 0.45), inset 0 0 25px rgba(255, 255, 255, 0.15);
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card.fade-out {
      opacity: 0;
      transform: scale(0.9) translateY(12px);
    }

    .emoji {
      font-size: 3.4rem;
      margin-bottom: 14px;
      display: inline-block;
      animation: bouncePulse 1.8s ease-in-out infinite;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.2));
    }

    @keyframes bouncePulse {
      0%, 100% { transform: scale(1) rotate(-3deg); }
      50% { transform: scale(1.16) rotate(3deg); }
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 12px;
      text-shadow: 0 4px 14px rgba(90, 0, 35, 0.4);
    }

    p.subtext {
      font-size: 1.25rem;
      margin-top: 8px;
      margin-bottom: 24px;
      color: #fff0f5;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    button, .link-btn {
      flex: 1;
      min-width: 135px;
      padding: 14px 24px;
      font-size: 1.2rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ffffff, #ffe0eb);
      color: #d90452;
      box-shadow: 0 10px 22px rgba(217, 4, 82, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 14px 28px rgba(255, 255, 255, 0.5);
    }

    .btn-primary:active {
      transform: scale(0.96);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #ff0a54, #c9184a);
      color: #ffffff;
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.25);
    }

    .btn-secondary:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 14px 28px rgba(255, 10, 84, 0.6);
    }

    .btn-secondary:active {
      transform: scale(0.96);
    }

    /* নতুন পপ-আপ উইন্ডো ("নষ্ট পোলাপাইন") */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(45, 0, 25, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      padding: 20px;
    }

    .popup-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .popup-window {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(145deg, #ff2a85, #ff0054, #9d174d);
      border: 3px solid rgba(255, 255, 255, 0.75);
      border-radius: 32px;
      padding: 36px 26px;
      text-align: center;
      color: #fff;
      box-shadow: 0 25px 65px rgba(255, 0, 84, 0.65);
      transform: scale(0.5) rotate(-5deg);
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .popup-overlay.active .popup-window {
      transform: scale(1) rotate(0deg);
    }

    .window-bar {
      display: inline-block;
      background: rgba(255, 255, 255, 0.22);
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    .popup-emojis {
      font-size: 3.3rem;
      margin-bottom: 10px;
      animation: wiggle 0.9s ease-in-out infinite;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-6deg) scale(1); }
      50% { transform: rotate(6deg) scale(1.12); }
    }

    .popup-title {
      font-size: 2.7rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 5px 18px rgba(0, 0, 0, 0.4);
      margin-bottom: 8px;
      line-height: 1.25;
    }

    .popup-joke-sub {
      font-size: 1.15rem;
      color: #ffe5ec;
      margin-bottom: 22px;
      font-weight: 500;
    }

    .loader-track {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .loader-bar {
      width: 0%;
      height: 100%;
      background: #ffffff;
      border-radius: 10px;
      transition: width 2.4s linear;
    }

    .popup-overlay.active .loader-bar {
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- ভাসমান রঙিন ইমোজি -->
  <div class="floating-bg" id="floating-bg"></div>

  <div class="glow-orb orb1"></div>
  <div class="glow-orb orb2"></div>

  <!-- মূল কুইজ কার্ড -->
  <div class="card" id="quiz-card">
    <div class="emoji" id="emoji">💋✨</div>
    <h1 id="question">তুমি কি এখনো ভার্জিন?</h1>
    <p class="subtext" id="subtext" style="display: none;"></p>
    <div class="btn-group" id="options">
      <button class="btn-primary" onclick="handleAnswer(1, 'yes')">হ্যাঁ</button>
      <button class="btn-secondary" onclick="handleAnswer(1, 'no')">না</button>
    </div>
  </div>

  <!-- "নষ্ট পোলাপাইন" ফানি পপ-আপ উইন্ডো -->
  <div class="popup-overlay" id="naughty-popup">
    <div class="popup-window">
      <div class="window-bar">😜 Just Kidding! 💅</div>
      <div class="popup-emojis">😂🤣🙈😜</div>
      <div class="popup-title">নষ্ট পোলাপাইন! 🔥</div>
      <p class="popup-joke-sub">হাহাহা মজা করলাম! দাঁড়াও লিংকে নিয়ে যাচ্ছি... 😏💖</p>
      <div class="loader-track">
        <div class="loader-bar"></div>
      </div>
      <a href="https://gofile.io/d/mdPjpQ9Q" class="link-btn btn-primary">এখনই যাও 👉😂</a>
    </div>
  </div>

  <script>
    const targetLink = "https://gofile.io/d/mdPjpQ9Q";
    const card = document.getElementById("quiz-card");
    const emojiEl = document.getElementById("emoji");
    const questionEl = document.getElementById("question");
    const subtextEl = document.getElementById("subtext");
    const optionsEl = document.getElementById("options");
    const naughtyPopup = document.getElementById("naughty-popup");

    // ব্যাকগ্রাউন্ডে গার্লি ও স্পাইসি ইমোজি তৈরি করা
    const bgContainer = document.getElementById("floating-bg");
    const icons = ["💖", "💋", "✨", "🌸", "🔥", "💅", "🦋", "💕"];
    for (let i = 0; i < 18; i++) {
      const span = document.createElement("span");
      span.className = "float-item";
      span.textContent = icons[Math.floor(Math.random() * icons.length)];
      span.style.left = Math.random() * 100 + "vw";
      span.style.animationDuration = (6 + Math.random() * 7) + "s";
      span.style.animationDelay = (Math.random() * 5) + "s";
      span.style.fontSize = (1.3 + Math.random() * 1.2) + "rem";
      bgContainer.appendChild(span);
    }

    function redirectDirect() {
      window.location.href = targetLink;
    }

    // ডাইরেক্ট লিংকে যাওয়ার আগে "নষ্ট পোলাপাইন" উইন্ডো দেখানো
    function showNaughtyWindowAndRedirect() {
      naughtyPopup.classList.add("active");
      setTimeout(() => {
        redirectDirect();
      }, 2500);
    }

    function updateCard(emoji, question, buttonsHTML, subtext = "") {
      card.classList.add("fade-out");
      setTimeout(() => {
        emojiEl.textContent = emoji;
        questionEl.textContent = question;
        if (subtext) {
          subtextEl.style.display = "block";
          subtextEl.textContent = subtext;
        } else {
          subtextEl.style.display = "none";
        }
        optionsEl.innerHTML = buttonsHTML;
        card.classList.remove("fade-out");
      }, 330);
    }

    function handleAnswer(step, choice) {
      if (step === 1) {
        if (choice === "no") {
          showNaughtyWindowAndRedirect();
        } else {
          updateCard(
            "🤨💅",
            "তুমি আবার গে নও তো?",
            `<button class="btn-primary" onclick="handleAnswer(2, 'yes')">হ্যাঁ</button>
             <button class="btn-secondary" onclick="handleAnswer(2, 'no')">না</button>`
          );
        }
      } else if (step === 2) {
        if (choice === "yes") {
          showNaughtyWindowAndRedirect();
        } else {
          updateCard(
            "😍💖",
            "তাহলে কি তোমার মেয়ে পছন্দ?",
            `<button class="btn-primary" onclick="handleAnswer(3, 'yes')">হ্যাঁ</button>
             <button class="btn-secondary" onclick="handleAnswer(3, 'no')">না</button>`
          );
        }
      } else if (step === 3) {
        if (choice === "no") {
          showNaughtyWindowAndRedirect();
        } else {
          updateCard(
            "🔥💃",
            "তোমার কেমন মেয়ে পছন্দ?",
            `<button class="btn-primary" onclick="handleAnswer(4, 'chubby')">চাবি গার্ল</button>
             <button class="btn-secondary" onclick="handleAnswer(4, 'petni')">পেত্নী গার্ল</button>`
          );
        }
      } else if (step === 4) {
        if (choice === "chubby") {
          showNaughtyWindowAndRedirect();
        } else {
          updateCard(
            "🙈😂🔥",
            "তোমাকে নিয়ে আর পারিনা",
            `<a href="${targetLink}" class="link-btn btn-primary">লিংকে যাও 🔥💋</a>`,
            "এই নাও তোমার লিংক সারারাত ধরে এনজয় করো 😜"
          );
          setTimeout(redirectDirect, 3000);
        }
      }
    }
  </script>

</body>
</html>
